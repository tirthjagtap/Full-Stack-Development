
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration and Result Management</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Student Portal</h1>
        <p>Student Registration and Result Management System</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Student Registration</h2>

            <form id="studentForm">

                <label for="name">Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter full name" required>

                <label for="roll">Roll Number</label>
                <input type="text" id="roll"
                       placeholder="Enter roll number" required>

                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter email address" required>

                <label for="studentClass">Class / Course</label>
                <input type="text" id="studentClass"
                       placeholder="e.g. MCA Semester I" required>

                <h2>Enter Subject Marks (Out of 100)</h2>

                <label for="html">HTML5</label>
                <input type="number" id="html" min="0" max="100" required>

                <label for="css">CSS3</label>
                <input type="number" id="css" min="0" max="100" required>

                <label for="javascript">JavaScript</label>
                <input type="number" id="javascript" min="0" max="100" required>

                <label for="database">Database</label>
                <input type="number" id="database" min="0" max="100" required>

                <label for="programming">Programming</label>
                <input type="number" id="programming" min="0" max="100" required>

                <p id="errorMessage" class="error"></p>

                <button type="submit">
                    Register and Calculate Result
                </button>

            </form>
        </section>

        <section class="card" id="resultSection" hidden>
            <h2>Student Result</h2>
            <div id="resultContent"></div>

            <button type="button" id="jsonBtn">
                View Student JSON
            </button>

            <pre id="jsonOutput" hidden></pre>
        </section>

        <section class="card">
            <h2>Saved Student Records</h2>
            <div id="recordsList"></div>

            <button type="button" id="clearBtn">
                Clear All Records
            </button>
        </section>

    </main>

    <footer>
        <p>Full Stack Development - Assignment 1</p>
    </footer>

</body>
</html>
